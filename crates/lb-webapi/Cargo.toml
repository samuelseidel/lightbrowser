[package]
name = "lb-webapi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Same family features as lb-js. The firefox build has only the descriptor
# tables (no installer, no implementations) until SpiderMonkey lands in M4b.
default = ["chrome"]
chrome = ["lb-js/chrome", "dep:lb-paint", "dep:lb-gl", "dep:boring", "dep:boring-sys", "dep:foreign-types"]
firefox = ["lb-js/firefox"]

[dependencies]
bytes = "1"
lb-js = { path = "../lb-js", default-features = false }
lb-persona = { path = "../lb-persona" }
lb-dom = { path = "../lb-dom" }
lb-css = { path = "../lb-css" }
lb-layout = { path = "../lb-layout" }
# Canvas 2D raster and image codecs (chrome build only for now).
lb-paint = { path = "../lb-paint", optional = true }
lb-gl = { path = "../lb-gl", optional = true }
url = "2"
# Inboxes of windows on other threads (workers, ADR 0021).
tokio = { version = "1", default-features = false, features = ["sync"] }
encoding_rs = "0.8"
# Web Crypto on the BoringSSL lb-net already links (chrome build).
boring = { version = "5", optional = true }
# Raw FFI for what `boring` does not wrap (RSA-OAEP digests and labels,
# raw Ed25519/X25519 keys).
boring-sys = { version = "5", optional = true }
foreign-types = { version = "0.5", optional = true }
serde_json = "1"
percent-encoding = "2"
form_urlencoded = "1"

[dev-dependencies]
serde_json = "1"

# Realm creation and snapshot timings (M6): cargo run --release -p lb-webapi --example realm_bench
[[example]]
name = "realm_bench"
required-features = ["chrome"]

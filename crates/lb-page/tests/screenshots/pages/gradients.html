<!doctype html><html><head><style>
html, body { margin: 0; background: #fff }
div { position: absolute; width: 90px; height: 70px }
#a { left: 10px; top: 10px; background: linear-gradient(red, blue) }
#b { left: 110px; top: 10px; background: linear-gradient(45deg, #f80 10%, transparent 50%, #08f 90%) }
#c { left: 210px; top: 10px; background: linear-gradient(to top right, yellow, green) }
#d { left: 310px; top: 10px; background: linear-gradient(90deg, red, 30%, blue) }
#e { left: 10px; top: 90px; background: repeating-linear-gradient(45deg, #333 0 6px, #eee 6px 12px) }
#f { left: 110px; top: 90px; background: radial-gradient(circle, red, blue 40px) }
#g { left: 210px; top: 90px; background: radial-gradient(ellipse at top left, white, purple) }
#h { left: 310px; top: 90px; background: radial-gradient(farthest-side at 30px 30px, orange, teal) }
#i { left: 10px; top: 170px; background: repeating-radial-gradient(circle at center, #000 0 5px, #fff 5px 10px) }
#j { left: 110px; top: 170px; background: radial-gradient(closest-side, lime, navy) }
#k { left: 210px; top: 170px; background: linear-gradient(red 0 50%, blue 50% 100%) 0 0 / 30px 30px }
#l { left: 310px; top: 170px; background: radial-gradient(40px 20px at 50% 50%, gold, transparent) , #345 }
</style></head><body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div>
<div id=e></div><div id=f></div><div id=g></div><div id=h></div>
<div id=i></div><div id=j></div><div id=k></div><div id=l></div>
</body></html>

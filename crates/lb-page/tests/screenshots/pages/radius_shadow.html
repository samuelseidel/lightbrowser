<!doctype html><html><head><style>
html, body { margin: 0; background: #fff }
div, img { position: absolute; width: 70px; height: 50px; display: block }
#a { left: 15px; top: 15px; background: #48c; border-radius: 12px }
#b { left: 115px; top: 15px; background: #fc6; border: 6px solid #333; border-radius: 20px 5px }
#c { left: 215px; top: 15px; background: #6c6; border-radius: 50% }
#d { left: 315px; top: 15px; background: #c66; border-radius: 30px / 15px; border: 4px solid; border-color: red green blue orange }
#e { left: 15px; top: 105px; background: #fff; box-shadow: 4px 4px 0 #000 }
#f { left: 115px; top: 105px; background: #eee; box-shadow: 0 0 10px 2px rgba(0, 0, 200, 0.6) }
#g { left: 215px; top: 105px; background: #ffd; border-radius: 10px; box-shadow: 6px 6px 8px rgba(0, 0, 0, 0.5), -3px -3px 0 red }
#h { left: 315px; top: 105px; background: #fff; box-shadow: inset 0 0 10px #000 }
#i { left: 15px; top: 195px; background: #fff; border: 5px solid #888; box-shadow: inset 8px 8px 0 0 #39f; border-radius: 8px }
#j { left: 115px; top: 195px; border-radius: 25px; border: 3px solid #000 }
#k { left: 215px; top: 195px; background: linear-gradient(red, blue); border-radius: 0 30px }
#l { left: 315px; top: 195px; background: url(img/grid.png); border-radius: 50%; box-shadow: 0 0 0 5px #0a0 }
</style></head><body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div>
<div id=e></div><div id=f></div><div id=g></div><div id=h></div>
<div id=i></div><img id=j src=img/photo.jpg><div id=k></div><div id=l></div>
</body></html>

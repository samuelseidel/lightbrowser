<!doctype html><html><head><style>
html, body { margin: 0; background: #fff }
div { position: absolute; width: 90px; height: 70px; outline: none }
#a { left: 10px; top: 10px; background: url(img/grid.png) }
#b { left: 110px; top: 10px; background: #ddd url(img/photo.jpg) no-repeat center / 60px 40px }
#c { left: 210px; top: 10px; background: url(img/dots.webp) repeat-x 10px 20px }
#d { left: 310px; top: 10px; background: #eef url(img/anim.gif) no-repeat right 5px bottom 5px }
#e { left: 10px; top: 90px; background: url(img/grid.png) space }
#f { left: 110px; top: 90px; background: url(img/grid.png) round; width: 95px }
#g { left: 210px; top: 90px; background: url(img/photo.jpg) center / cover no-repeat }
#h { left: 310px; top: 90px; background: #ccc url(img/photo.jpg) center / contain no-repeat }
#i { left: 10px; top: 170px; width: 50px; height: 30px; border: 10px solid rgba(0, 0, 0, 0.3); padding: 10px;
     background: url(img/grid.png) content-box padding-box, yellow }
#j { left: 130px; top: 170px; background: url(img/grid.png) no-repeat 5px 5px, linear-gradient(to right, red, blue) }
#k { left: 230px; top: 170px; background: url(img/grid.png) repeat-y 50% 0 / 30px 15px, #9cf }
#l { left: 330px; top: 170px; width: 60px; background-image: url(img/dots.webp), url(img/grid.png);
     background-position: 0 0, 30px 30px; background-repeat: no-repeat, repeat }
</style></head><body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div>
<div id=e></div><div id=f></div><div id=g></div><div id=h></div>
<div id=i></div><div id=j></div><div id=k></div><div id=l></div>
</body></html>

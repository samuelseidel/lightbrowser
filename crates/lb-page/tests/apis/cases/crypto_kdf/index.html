<!doctype html><!--LOG--><script>
var S = crypto.subtle;
function k(key) { return [key.type, key.extractable, JSON.stringify(key.algorithm), key.usages.join('/')].join(' '); }
(async () => {
  var pw = await S.importKey('raw', enc('password'), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
  log('pbkdf2 key ' + k(pw));
  for (const h of ['SHA-1', 'SHA-256', 'SHA-512'])
    for (const len of [128, 256, 520])
      await a('pbkdf2 ' + h + ' ' + len, async () => hex(await S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 1000, hash: h }, pw, len)));
  await a('pbkdf2 iterations 0', () => S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 0, hash: 'SHA-256' }, pw, 256));
  await a('pbkdf2 len 0', async () => hex(await S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 1, hash: 'SHA-256' }, pw, 0)));
  await a('pbkdf2 len 7', () => S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 1, hash: 'SHA-256' }, pw, 7));
  await a('pbkdf2 len null', () => S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 1, hash: 'SHA-256' }, pw, null));
  await a('pbkdf2 len missing', () => S.deriveBits({ name: 'PBKDF2', salt: enc('salt'), iterations: 1, hash: 'SHA-256' }, pw));
  await a('pbkdf2 extractable', () => S.importKey('raw', enc('password'), 'PBKDF2', true, ['deriveBits']));
  await a('pbkdf2 export', () => S.exportKey('raw', pw));
  await a('pbkdf2 no salt', () => S.deriveBits({ name: 'PBKDF2', iterations: 1, hash: 'SHA-256' }, pw, 128));
  await a('derive aes', async () => { var d = await S.deriveKey({ name: 'PBKDF2', salt: enc('salt'), iterations: 10, hash: 'SHA-256' }, pw, { name: 'AES-GCM', length: 256 }, true, ['encrypt']); return k(d) + ' ' + hex(await S.exportKey('raw', d)); });
  await a('derive hmac', async () => { var d = await S.deriveKey({ name: 'PBKDF2', salt: enc('salt'), iterations: 10, hash: 'SHA-256' }, pw, { name: 'HMAC', hash: 'SHA-384' }, true, ['sign']); return k(d) + ' ' + hex(await S.exportKey('raw', d)); });
  await a('derive hmac no length bad', () => S.deriveKey({ name: 'PBKDF2', salt: enc('salt'), iterations: 10, hash: 'SHA-256' }, pw, { name: 'AES-GCM' }, true, ['encrypt']));
  var ikm = await S.importKey('raw', unhex('0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b'), 'HKDF', false, ['deriveBits', 'deriveKey']);
  log('hkdf key ' + k(ikm));
  for (const h of ['SHA-1', 'SHA-256', 'SHA-384'])
    await a('hkdf ' + h, async () => hex(await S.deriveBits({ name: 'HKDF', hash: h, salt: unhex('000102030405060708090a0b0c'), info: unhex('f0f1f2f3f4f5f6f7f8f9') }, ikm, 336)));
  await a('hkdf empty salt', async () => hex(await S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new Uint8Array(0) }, ikm, 256)));
  await a('hkdf too long', () => S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new Uint8Array(0) }, ikm, 255 * 256 + 8));
  await a('hkdf no info', () => S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0) }, ikm, 256));
  await a('hkdf len null', () => S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new Uint8Array(0) }, ikm, null));
  await a('hkdf derive aes', async () => { var d = await S.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new Uint8Array(0) }, ikm, { name: 'AES-CBC', length: 128 }, true, ['decrypt']); return k(d) + ' ' + hex(await S.exportKey('raw', d)); });
  await a('derive with deriveBits-only', async () => { var o = await S.importKey('raw', enc('p'), 'PBKDF2', false, ['deriveBits']); return S.deriveKey({ name: 'PBKDF2', salt: enc('s'), iterations: 1, hash: 'SHA-256' }, o, { name: 'AES-GCM', length: 128 }, true, ['encrypt']); });
  await a('hkdf generate', () => S.generateKey({ name: 'HKDF' }, false, ['deriveBits']));
  await a('pbkdf2 jwk', () => S.importKey('jwk', { kty: 'oct', k: 'AAEC' }, 'PBKDF2', false, ['deriveBits']));
  end();
})();
</script>

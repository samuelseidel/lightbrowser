<!DOCTYPE html>
<meta charset="utf-8">
<title>canvas probe</title>
<body>
<pre id="out"></pre>
<script>
const L = [];
const log = (k, v) => L.push(k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v)));
function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16); }
function fnvA(a) { let h = 0x811c9dc5; for (let i = 0; i < a.length; i++) { h ^= a[i]; h = Math.imul(h, 16777619) >>> 0; } return h.toString(16); }
function eq(a, b) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
function diffs(a, b) { let n = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++; return n; }
function region(data, w, x0, y0, rw, rh) { const o = new Uint8ClampedArray(rw * rh * 4); for (let y = 0; y < rh; y++) for (let x = 0; x < rw * 4; x++) o[(y * rw) * 4 + x] = data[((y0 + y) * w + x0) * 4 + x]; return o; }
function mk(w, h, opts) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', opts)]; }
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
const FONT = '"Times New Roman", serif';
function textScene(x, ox = 0, oy = 0, bg = true) {
  if (bg) { x.fillStyle = '#fff'; x.fillRect(0, 0, x.canvas.width, x.canvas.height); }
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#f60'; x.fillRect(100 + ox, 1 + oy, 62, 20);
  x.fillStyle = '#069'; x.font = '11pt "Times New Roman"';
  x.fillText('Cwm fjordbank gly \u{1F603}', 2 + ox, 15 + oy);
  x.fillStyle = 'rgba(102, 204, 0, 0.2)'; x.font = '18pt Arial';
  x.fillText('Cwm fjordbank gly \u{1F603}', 4 + ox, 45 + oy);
  x.strokeStyle = '#333'; x.lineWidth = 1.5; x.font = '20px Arial';
  x.strokeText('\u{1F47E}A', 170 + ox, 40 + oy);
  x.beginPath(); x.arc(220 + ox, 30 + oy, 12.3, 0, 5); x.fillStyle = '#5a5'; x.fill();
}
(async () => {
// --- CreepJS getPixelMods (random 1x1 fills, read, refill, read) ---
{
  const r = rng(7); const len = 8;
  const [c1, x1] = mk(len, len, { willReadFrequently: true, desynchronized: true });
  const [c2, x2] = mk(len, len, { willReadFrequently: true, desynchronized: true });
  const p1 = [], p2 = [];
  for (let X = 0; X < len; X++) for (let Y = 0; Y < len; Y++) {
    const col = `${~~(r() * 256)}, ${~~(r() * 256)}, ${~~(r() * 256)}, 255`;
    x1.fillStyle = `rgba(${col})`; x1.fillRect(X, Y, 1, 1); p1.push(col);
  }
  const ch = new Set(); let n = 0;
  for (let X = 0; X < len; X++) for (let Y = 0; Y < len; Y++) {
    const [R, G, B, A] = x1.getImageData(X, Y, 1, 1).data;
    const col = `${R}, ${G}, ${B}, ${A}`;
    x2.fillStyle = `rgba(${col})`; x2.fillRect(X, Y, 1, 1);
    const [R2, G2, B2, A2] = x2.getImageData(X, Y, 1, 1).data;
    if (R !== R2 || G !== G2 || B !== B2 || A !== A2) ch.add('second');
    p2.push(col);
  }
  for (let i = 0; i < p1.length; i++) if (p1[i] !== p2[i]) n++;
  log('creep_pixel_mods', n);
  log('creep_refill_mods', [...ch].join());
}
// --- CreepJS blank-after-clear and low-entropy 2x2 ---
{
  const [c, x] = mk(50, 50);
  x.font = '35px ' + FONT; x.fillText('\u{1F47E}', 0, 37);
  x.clearRect(0, 0, c.width, c.height);
  log('creep_blank_max', Math.max(...x.getImageData(0, 0, 8, 8).data));
  c.width = 2; c.height = 2;
  x.fillStyle = '#000'; x.fillRect(0, 0, 2, 2);
  x.fillStyle = '#fff'; x.fillRect(2, 2, 1, 1);
  x.beginPath(); x.arc(0, 0, 2, 0, 1, true); x.closePath(); x.fill();
  log('creep_low_entropy', x.getImageData(0, 0, 2, 2).data.join(''));
  const m = x.measureText('');
  log('creep_metric_float', [m.actualBoundingBoxAscent, m.actualBoundingBoxDescent, m.actualBoundingBoxLeft, m.actualBoundingBoxRight, m.fontBoundingBoxAscent, m.fontBoundingBoxDescent].some((v) => (v || 0) % 1 !== 0));
}
// --- FingerprintJS: text image encoded twice, winding ---
{
  const [c, x] = mk(1, 1);
  x.rect(0, 0, 10, 10); x.rect(2, 2, 6, 6);
  log('fpjs_winding', !x.isPointInPath(5, 5, 'evenodd'));
  c.width = 240; c.height = 60;
  textScene(x, 0, 0, false);
  const a = c.toDataURL(), b = c.toDataURL();
  log('fpjs_text_stable', a === b);
  c.width = 122; c.height = 110;
  x.globalCompositeOperation = 'multiply';
  for (const [col, X, Y] of [['#f2f', 40, 40], ['#2ff', 80, 40], ['#ff2', 60, 80]]) { x.fillStyle = col; x.beginPath(); x.arc(X, Y, 40, 0, Math.PI * 2, true); x.closePath(); x.fill(); }
  x.fillStyle = '#f9c'; x.arc(60, 60, 60, 0, Math.PI * 2, true); x.arc(60, 60, 20, 0, Math.PI * 2, true); x.fill('evenodd');
  const g1 = c.toDataURL();
  log('fpjs_geometry_stable', g1 === c.toDataURL());
}
// --- Solid fills read back exactly (opaque and translucent) ---
{
  const [c, x] = mk(4, 4);
  const out = [];
  for (const col of ['rgb(10,20,30)', 'rgb(255,255,255)', 'rgb(1,2,3)', 'rgba(10,20,30,0.5)', 'rgba(200,100,50,0.25)', 'rgba(255,0,128,0.01)']) {
    x.clearRect(0, 0, 4, 4); x.fillStyle = col; x.fillRect(0, 0, 4, 4);
    const d = x.getImageData(0, 0, 4, 4).data; const v = Array.from(d.slice(0, 4));
    let same = true; for (let i = 0; i < d.length; i += 4) if (d[i] !== v[0] || d[i + 1] !== v[1] || d[i + 2] !== v[2] || d[i + 3] !== v[3]) same = false;
    out.push(v.join(' ') + (same ? '' : ' (varies)'));
  }
  log('solid_fills', out.join(' | '));
}
// --- putImageData round trip ---
{
  const r = rng(11); const W = 16, H = 16;
  const [c, x] = mk(W, H);
  const op = new ImageData(W, H);
  for (let i = 0; i < op.data.length; i++) op.data[i] = (i % 4 === 3) ? 255 : ~~(r() * 256);
  x.putImageData(op, 0, 0);
  log('put_opaque_exact', eq(op.data, x.getImageData(0, 0, W, H).data));
  const tr = new ImageData(W, H);
  for (let i = 0; i < tr.data.length; i++) tr.data[i] = ~~(r() * 256);
  x.putImageData(tr, 0, 0);
  const back = x.getImageData(0, 0, W, H).data;
  log('put_translucent_hash', fnvA(back));
  x.putImageData(new ImageData(back, W, H), 0, 0);
  log('put_translucent_second_trip_exact', eq(back, x.getImageData(0, 0, W, H).data));
  // putImageData with an offset and dirty rect
  const [c2, x2] = mk(W + 5, H + 3);
  x2.putImageData(op, 5, 3);
  log('put_offset_exact', eq(op.data, x2.getImageData(5, 3, W, H).data));
}
// --- Every (value, alpha) through putImageData and getImageData; fillStyle alphas ---
{
  const [c, x] = mk(256, 256);
  const id = new ImageData(256, 256);
  for (let a = 0; a < 256; a++) for (let v = 0; v < 256; v++) { const i = (a * 256 + v) * 4; id.data[i] = v; id.data[i + 1] = 255 - v; id.data[i + 2] = (v * 7) & 255; id.data[i + 3] = a; }
  x.putImageData(id, 0, 0);
  log('premul_table', fnvA(x.getImageData(0, 0, 256, 256).data));
  const f = [];
  for (let a = 0; a < 256; a++) { x.clearRect(0, 0, 1, 1); x.fillStyle = `rgba(200,100,50,${a / 255})`; x.fillRect(0, 0, 1, 1); f.push(...x.getImageData(0, 0, 1, 1).data); }
  log('fill_alpha_table', fnvA(f));
}
// --- Text scene: read consistency ---
const [tc, tx] = mk(240, 60);
textScene(tx);
const full = tx.getImageData(0, 0, 240, 60).data;
{
  log('read_twice_equal', eq(full, tx.getImageData(0, 0, 240, 60).data));
  log('subrect_equal', eq(region(full, 240, 37, 11, 50, 23), tx.getImageData(37, 11, 50, 23).data));
  // 1x1 reads match the full read
  let ok = true; for (let i = 0; i < 400; i++) { const X = (i * 37) % 240, Y = (i * 13) % 60; const p = tx.getImageData(X, Y, 1, 1).data; for (let k = 0; k < 4; k++) if (p[k] !== full[(Y * 240 + X) * 4 + k]) ok = false; }
  log('pixel_reads_equal', ok);
  // Opaque pixels of single-colour text carry exactly the fill colour.
  const [sc, sx] = mk(200, 40); sx.fillStyle = '#069'; sx.font = '24px Arial'; sx.fillText('Cwm fjordbank gly', 3, 28);
  const sd = sx.getImageData(0, 0, 200, 40).data; const cols = new Set(); let inked = 0;
  for (let i = 0; i < sd.length; i += 4) { if (sd[i + 3] === 0) continue; inked++; if (sd[i + 3] === 255) cols.add(sd[i] + ',' + sd[i + 1] + ',' + sd[i + 2]); }
  log('text_opaque_colours', [...cols].join(' '));
  log('text_inked_nonzero', inked > 0);
  // putImageData of a read gives the same read
  const [pc, px] = mk(240, 60); px.putImageData(new ImageData(full.slice(), 240, 60), 0, 0);
  log('put_read_equal', eq(full, px.getImageData(0, 0, 240, 60).data));
  log('put_read_dataurl_equal', pc.toDataURL() === tc.toDataURL());
}
// --- toDataURL decoded matches getImageData (same size and offset) ---
{
  const img = await loadImg(tc.toDataURL());
  const [c1, x1] = mk(240, 60); x1.drawImage(img, 0, 0);
  log('dataurl_decode_equal', eq(full, x1.getImageData(0, 0, 240, 60).data));
  const [c2, x2] = mk(260, 75); x2.drawImage(img, 7, 9);
  log('dataurl_decode_offset_equal', eq(full, x2.getImageData(7, 9, 240, 60).data));
  const blob = await new Promise((res) => tc.toBlob(res));
  const bimg = await loadImg(URL.createObjectURL(blob));
  const [c3, x3] = mk(240, 60); x3.drawImage(bimg, 0, 0);
  log('blob_decode_equal', eq(full, x3.getImageData(0, 0, 240, 60).data));
  const dataBytes = atob(tc.toDataURL().split(',')[1]);
  const blobBytes = new Uint8Array(await blob.arrayBuffer());
  log('blob_bytes_equal_dataurl', dataBytes.length === blobBytes.length && [...blobBytes].every((b, i) => b === dataBytes.charCodeAt(i)));
}
// --- drawImage(canvas) into another canvas ---
{
  const [c1, x1] = mk(300, 90); x1.drawImage(tc, 11, 13);
  log('drawimage_offset_equal', eq(full, x1.getImageData(11, 13, 240, 60).data));
}
// --- Integer translation: the same scene drawn 3,4 px further ---
{
  const [c1, x1] = mk(260, 80); x1.fillStyle = '#fff'; x1.fillRect(0, 0, 260, 80);
  textScene(x1, 3, 4, false);
  const t = x1.getImageData(3, 4, 240, 60).data;
  const [c0, x0] = mk(260, 80); x0.fillStyle = '#fff'; x0.fillRect(0, 0, 260, 80);
  textScene(x0, 0, 0, false);
  const s = x0.getImageData(0, 0, 240, 60).data;
  log('translate_diff_channels', diffs(s, t));
  // translate() instead of coordinates
  const [c2, x2] = mk(260, 80); x2.fillStyle = '#fff'; x2.fillRect(0, 0, 260, 80); x2.translate(3, 4);
  textScene(x2, 0, 0, false);
  log('translate_ctm_equal_coords', eq(t, x2.getImageData(3, 4, 240, 60).data));
}
// --- OffscreenCanvas vs element ---
{
  const oc = new OffscreenCanvas(240, 60); const ox = oc.getContext('2d'); textScene(ox);
  log('offscreen_equal', eq(full, ox.getImageData(0, 0, 240, 60).data));
  const ob = await oc.convertToBlob();
  const eb = await new Promise((res) => tc.toBlob(res));
  const [a, b] = [new Uint8Array(await ob.arrayBuffer()), new Uint8Array(await eb.arrayBuffer())];
  log('offscreen_blob_equal', eq(a, b));
  try {
    const bm = oc.transferToImageBitmap();
    const [c1, x1] = mk(240, 60); x1.drawImage(bm, 0, 0);
    log('imagebitmap_equal', eq(full, x1.getImageData(0, 0, 240, 60).data));
  } catch (e) { log('imagebitmap_equal', String(e)); }
  try {
    const bm = await createImageBitmap(tc);
    const [c1, x1] = mk(240, 60); x1.drawImage(bm, 0, 0);
    log('createimagebitmap_equal', eq(full, x1.getImageData(0, 0, 240, 60).data));
  } catch (e) { log('createimagebitmap_equal', String(e)); }
}
// --- Worker OffscreenCanvas ---
{
  const src = `${textScene.toString()}; onmessage = () => { try { const oc = new OffscreenCanvas(240, 60); const x = oc.getContext('2d'); textScene(x); postMessage(x.getImageData(0, 0, 240, 60).data); } catch (e) { postMessage(String(e)); } };`;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  const got = await Promise.race([new Promise((res) => { w.onmessage = (e) => res(e.data); w.postMessage(0); }), new Promise((res) => setTimeout(() => res('timeout'), 2000))]);
  log('worker_equal', typeof got === 'string' ? got : eq(full, got));
  w.terminate();
}
// --- Gradient is monotonic ---
{
  const [c, x] = mk(256, 1); const g = x.createLinearGradient(0, 0, 256, 0); g.addColorStop(0, '#000'); g.addColorStop(1, '#fff');
  x.fillStyle = g; x.fillRect(0, 0, 256, 1);
  const d = x.getImageData(0, 0, 256, 1).data; let mono = true, grey = true;
  for (let i = 4; i < d.length; i += 4) { if (d[i] < d[i - 4]) mono = false; if (d[i] !== d[i + 1] || d[i] !== d[i + 2]) grey = false; }
  log('gradient_monotonic', mono); log('gradient_grey', grey);
  log('gradient_ends', [d[0], d[1020]].join(' '));
}
// --- WebGL ---
{
  const c = document.createElement('canvas'); c.width = 64; c.height = 48;
  const gl = c.getContext('webgl', { preserveDrawingBuffer: true });
  gl.clearColor(0.2, 0.4, 0.6, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  const px = new Uint8Array(64 * 48 * 4); gl.readPixels(0, 0, 64, 48, gl.RGBA, gl.UNSIGNED_BYTE, px);
  log('gl_clear', Array.from(px.slice(0, 4)).join(' ') + (px.every((v, i) => v === px[i % 4]) ? '' : ' (varies)'));
  const vs = 'attribute vec2 p; attribute vec3 c; varying vec3 v; void main() { v = c; gl_Position = vec4(p, 0, 1); }';
  const fs = 'precision mediump float; varying vec3 v; uniform float k; void main() { gl_FragColor = vec4(v * k, 1); }';
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.9, -0.7, 1, 0, 0, 0.8, -0.6, 0, 1, 0, 0.1, 0.83, 0, 0, 1]), gl.STATIC_DRAW);
  const lp = gl.getAttribLocation(pr, 'p'), lc = gl.getAttribLocation(pr, 'c');
  gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(lc); gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, 20, 8);
  gl.uniform1f(gl.getUniformLocation(pr, 'k'), 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const a = new Uint8Array(64 * 48 * 4), b = new Uint8Array(64 * 48 * 4);
  gl.readPixels(0, 0, 64, 48, gl.RGBA, gl.UNSIGNED_BYTE, a); gl.readPixels(0, 0, 64, 48, gl.RGBA, gl.UNSIGNED_BYTE, b);
  log('gl_read_twice_equal', eq(a, b));
  const flip = new Uint8ClampedArray(a.length); for (let y = 0; y < 48; y++) flip.set(a.subarray((47 - y) * 256, (48 - y) * 256), y * 256);
  const [c2, x2] = mk(64, 48); x2.drawImage(c, 0, 0);
  log('gl_drawimage_equal_readpixels', eq(flip, x2.getImageData(0, 0, 64, 48).data));
  const img = await loadImg(c.toDataURL());
  const [c3, x3] = mk(64, 48); x3.drawImage(img, 0, 0);
  log('gl_dataurl_equal_readpixels', eq(flip, x3.getImageData(0, 0, 64, 48).data));
  const sub = new Uint8Array(10 * 7 * 4); gl.readPixels(20, 15, 10, 7, gl.RGBA, gl.UNSIGNED_BYTE, sub);
  let subok = true; for (let y = 0; y < 7; y++) for (let x = 0; x < 40; x++) if (sub[y * 40 + x] !== a[((15 + y) * 64 + 20) * 4 + x]) subok = false;
  log('gl_subrect_equal', subok);
  // A uniform-coloured triangle covers its interior with exactly that colour.
  gl.disableVertexAttribArray(lc); gl.vertexAttrib3f(lc, 0.2, 0.6, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const f = new Uint8Array(64 * 48 * 4); gl.readPixels(0, 0, 64, 48, gl.RGBA, gl.UNSIGNED_BYTE, f);
  const fc = new Map(); for (let i = 0; i < f.length; i += 4) { const k = f[i] + ' ' + f[i + 1] + ' ' + f[i + 2] + ' ' + f[i + 3]; fc.set(k, (fc.get(k) || 0) + 1); }
  const top = [...fc.entries()].sort((p, q) => q[1] - p[1]).slice(0, 2).map((e) => e[0]);
  log('gl_flat_top_colours', top.join(' | '));
  // Second canvas, same draw: identical
  const d2 = document.createElement('canvas'); d2.width = 64; d2.height = 48;
  log('gl_hash_stable', fnv(c.toDataURL()) === fnv(c.toDataURL()));
}
L.push('end');
document.getElementById('out').textContent = L.join('\n');
})().catch((e) => { L.push('error: ' + e + ' ' + e.stack); L.push('end'); document.getElementById('out').textContent = L.join('\n'); });
</script>
</body>

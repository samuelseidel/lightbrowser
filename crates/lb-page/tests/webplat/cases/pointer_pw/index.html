<!doctype html><!--LOG--><body style="margin:0"><div id=box style="width:400px;height:300px;background:#ccc"></div><script>
// Playwright's mouse API (move with steps, down, up, click) is a series
// of Input.dispatchMouseEvent, each answered before the next one: one
// pointermove for each, with one coalesced event. chrome.mjs calls the
// API; the Rust test sends the same commands (steps.json, "pw").
function brief(e) { return e.type + ' ' + e.clientX + ',' + e.clientY + ' btn=' + e.button + '/' + e.buttons + ' press=' + e.pressure; }
['pointerrawupdate', 'pointermove', 'pointerdown', 'pointerup', 'click'].forEach(function (type) {
  document.addEventListener(type, function (e) {
    // (Chrome's predictor adds a predicted event from the fourth move of a
    // quick series on, with times and fractions of its own: not logged.)
    log(brief(e) + ' coalesced=[' + e.getCoalescedEvents().map(brief).join(' ; ') + ']'
      + ' sc=' + (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents));
  });
});
function after() { end(); }
</script>

<!doctype html><html><head><title>observer</title></head><body>
<!--LOG-->
<script>
function nm(l){return l.map(function(e){return e.entryType.slice(0,3)+':'+short(e.name)}).join(' ')}
addEventListener('load',async function(){
  await sleep(300);
  var s=PerformanceObserver.supportedEntryTypes;
  log('supported '+J(s)+' same='+(s===PerformanceObserver.supportedEntryTypes)+' frozen='+Object.isFrozen(s)+' '+Array.isArray(s));
  log('tag '+Object.prototype.toString.call(new PerformanceObserver(function(){})));
  t('ctor none',function(){return new PerformanceObserver()});
  t('ctor bad',function(){return new PerformanceObserver(5)});
  t('ctor call',function(){return PerformanceObserver(function(){})});
  var po=new PerformanceObserver(function(){});
  t('observe none',function(){return po.observe()});
  t('observe empty',function(){return po.observe({})});
  t('observe both',function(){return po.observe({entryTypes:['mark'],type:'mark'})});
  t('observe empty types',function(){return po.observe({entryTypes:[]})});
  t('observe str',function(){return po.observe('mark')});
  t('observe bogus type',function(){return po.observe({type:'bogus'})});
  t('observe bogus types',function(){return po.observe({entryTypes:['bogus']})});
  t('observe buffered+types',function(){return po.observe({entryTypes:['mark'],buffered:true})});
  po.disconnect();
  t('observe types then type',function(){var p=new PerformanceObserver(function(){});p.observe({entryTypes:['mark']});p.observe({type:'measure'});return 'no throw'});
  t('observe type then types',function(){var p=new PerformanceObserver(function(){});p.observe({type:'mark'});p.observe({entryTypes:['measure']});return 'no throw'});
  t('observe type twice',function(){var p=new PerformanceObserver(function(){});p.observe({type:'mark'});p.observe({type:'measure'});p.disconnect();return 'ok'});
  t('observe returns',function(){var p=new PerformanceObserver(function(){});var r=p.observe({type:'mark'});p.disconnect();return r});
  t('takeRecords',function(){var p=new PerformanceObserver(function(){});return J(p.takeRecords())+' '+Array.isArray(p.takeRecords())});
  t('disconnect',function(){return new PerformanceObserver(function(){}).disconnect()});
  t('list ctor',function(){return new PerformanceObserverEntryList()});

  // timing of the callback relative to microtasks and timers
  var order=[];
  var o1=new PerformanceObserver(function(list,obs,opts){
    order.push('cb');
    log('cb args '+[list instanceof PerformanceObserverEntryList,Object.prototype.toString.call(list),obs===o1,this===o1,J(opts),arguments.length,nm(list.getEntries()),typeof list.getEntries,
      nm(list.getEntriesByType('mark')),nm(list.getEntriesByName('b')),nm(list.getEntriesByName('b','measure')),Object.getOwnPropertyNames(list).length,Array.isArray(list.getEntries())].join(' | '));
  });
  o1.observe({entryTypes:['mark','measure']});
  performance.mark('a',{startTime:1});performance.mark('b',{startTime:2});performance.measure('c','a','b');
  order.push('sync');
  Promise.resolve().then(function(){order.push('micro')});
  setTimeout(function(){order.push('timeout0')},0);
  var raf=await new Promise(function(r){requestAnimationFrame(function(){order.push('raf');r()})});
  await sleep(50);
  log('order '+order.join());
  o1.disconnect();
  // takeRecords empties the queue, no callback for them
  var calls=0;
  var o2=new PerformanceObserver(function(){calls++});
  o2.observe({type:'mark'});
  performance.mark('t1');performance.mark('t2');
  var rec=o2.takeRecords();
  log('takeRecords '+nm(rec)+' then '+o2.takeRecords().length);
  await sleep(50);
  log('calls after takeRecords '+calls);
  // disconnect drops queued entries
  performance.mark('t3');o2.disconnect();
  await sleep(50);
  log('calls after disconnect '+calls+' '+o2.takeRecords().length);
  performance.mark('t4');await sleep(50);
  log('calls after disconnected mark '+calls);
  // observe again after disconnect
  o2.observe({type:'mark'});performance.mark('t5');await sleep(50);
  log('calls after reobserve '+calls);o2.disconnect();
  // buffered
  var got=[];
  var o3=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o3.observe({type:'mark',buffered:true});
  await sleep(50);
  log('buffered mark '+got.join(' / '));
  // buffered with entryTypes is ignored
  got=[];var o3b=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o3b.observe({entryTypes:['mark'],buffered:true});await sleep(50);
  log('buffered entryTypes '+got.length);o3b.disconnect();
  o3.disconnect();
  // navigation and paint are observable with buffered
  got=[];var o4=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o4.observe({type:'navigation',buffered:true});
  await sleep(50);
  log('buffered nav '+got.join(' / '));o4.disconnect();
  got=[];var o4b=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o4b.observe({type:'paint',buffered:true});
  await sleep(300);
  log('buffered paint '+got.join(' / '));o4b.disconnect();
  got=[];var o4c=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o4c.observe({type:'navigation',buffered:true});
  o4c.observe({type:'paint',buffered:true});
  o4c.observe({type:'resource',buffered:true});
  await sleep(50);
  log('buffered three '+got.map(function(x){return x.replace(/res:\S+/g,'res').replace(/ res( res)*/,' res*')}).join(' / '));o4c.disconnect();
  // which types a buffered observe replays
  var bt=[];
  for(var ty of ['paint','mark','measure','visibility-state','navigation','longtask','layout-shift','largest-contentful-paint','first-input','event','element','long-animation-frame']){
    var n=0,names=[];var ob=new PerformanceObserver(function(l){n+=l.getEntries().length;l.getEntries().forEach(function(e){names.push(e.name.slice(0,12))})});
    ob.observe({type:ty,buffered:true});await sleep(60);ob.disconnect();
    bt.push(ty+'='+n);
  }
  log('buffered by type '+bt.join(' ').replace(/mark=\d+/,'mark=N').replace(/measure=\d+/,'measure=N'));
  // droppedEntriesCount in the callback options
  var opts=[];
  var o6=new PerformanceObserver(function(l,o,op){opts.push(J(op))});
  o6.observe({type:'mark'});performance.mark('p1');await sleep(30);performance.mark('p2');await sleep(30);
  o6.observe({type:'mark',buffered:true});await sleep(30);performance.mark('p3');await sleep(30);o6.disconnect();
  t('reobserve entryTypes',function(){o6.observe({entryTypes:['mark']});return 'ok'});performance.mark('p4');await sleep(30);o6.disconnect();
  log('options '+opts.join(' '));
  // resources
  got=[];var o5=new PerformanceObserver(function(l){got.push(nm(l.getEntries()))});
  o5.observe({type:'resource'});
  await drain(fetch('o.txt?size=3&a=1'));await drain(fetch('o.txt?size=3&a=2'));
  await sleep(100);
  log('resource '+got.join(' / '));
  var o5b=new PerformanceObserver(function(l){got.push('B'+l.getEntries().length)});
  got=[];o5b.observe({type:'resource',buffered:true});await sleep(50);
  log('resource buffered count>=2 '+(got.length==1&&got[0].length>0)+' '+/B\d+/.test(got[0]||''));
  o5.disconnect();o5b.disconnect();
  // several observers see the same entries; order of callbacks follows observe order
  var seq=[];
  var oa=new PerformanceObserver(function(l){seq.push('a'+l.getEntries().length)});
  var ob=new PerformanceObserver(function(l){seq.push('b'+l.getEntries().length)});
  ob.observe({type:'measure'});oa.observe({type:'measure'});
  performance.measure('z1',{start:1,end:2});performance.measure('z2',{start:1,end:2});
  await sleep(50);
  log('two observers '+seq.join());oa.disconnect();ob.disconnect();
  // callback that throws does not stop others; exceptions are reported
  var errs=[];window.onerror=function(m){errs.push(m);return true};
  var oc=new PerformanceObserver(function(){throw new Error('boom')});
  oc.observe({type:'mark'});performance.mark('boom');await sleep(50);
  log('throw '+errs.join('|'));oc.disconnect();window.onerror=null;
  // entries are the same objects as in the timeline
  var same=null;var od=new PerformanceObserver(function(l){same=(l.getEntries()[0]===performance.getEntriesByName('same')[0])});
  od.observe({type:'mark'});performance.mark('same');await sleep(50);
  log('same object '+same);od.disconnect();
  // observing a type twice in entryTypes
  var oe=new PerformanceObserver(function(l){log('dup types '+l.getEntries().length)});
  oe.observe({entryTypes:['mark','mark']});performance.mark('x');await sleep(50);oe.disconnect();
  end();
});
</script></body></html>

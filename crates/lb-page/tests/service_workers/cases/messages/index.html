<!doctype html><title>messages</title><!--LOG-->
<script>
var n = load(), sw = navigator.serviceWorker;
if (n === 0) {
  sw.register('sw.js').then(function () { return sw.ready }).then(again);
} else {
  var c = sw.controller;
  sw.onmessage = function (e) {
    log('page message ' + e.constructor.name + ' ' + JSON.stringify(e.data) + ' origin=' + rel(e.origin) + ' source===controller ' + (e.source === c) + ' ' + Object.prototype.toString.call(e.source) + ' ports=' + e.ports.length + ' lastEventId="' + e.lastEventId + '"');
    // The port message goes after the first reply (their relative order
    // would depend on IPC timing in Chrome).
    var ch = new MessageChannel();
    ch.port1.onmessage = function (e) { log('port1 got ' + e.data); swlog(c).then(end) };
    c.postMessage('with port', [ch.port2]);
  };
  c.postMessage({ a: 1, d: new Date(0), m: new Map([[1, 2]]) });
  try { c.postMessage(function () {}) } catch (e) { log('post fn ' + e.name + ': ' + e.message) }
}
</script>

<!doctype html><!--LOG--><script>
(async function(){
  await fresh('errs');
  t('IDBRequest ctor', function(){return new IDBRequest()});
  t('IDBDatabase ctor', function(){return new IDBDatabase()});
  t('IDBFactory ctor', function(){return new IDBFactory()});
  t('cmp no args', function(){return indexedDB.cmp()});
  t('open toString', function(){return indexedDB.open.toString()});
  t('open name obj', function(){var q=indexedDB.open({toString:function(){return 'errs-obj'}}); q.onsuccess=function(){q.result.close(); indexedDB.deleteDatabase('errs-obj')}; return String(q)});
  t('proto names', function(){return Object.getOwnPropertyNames(IDBObjectStore.prototype).sort().join(',')});
  t('proto names2', function(){return Object.getOwnPropertyNames(IDBCursor.prototype).sort().join(',')});
  var r = indexedDB.open('errs', 1);
  var store, idx, upgradeTx;
  r.onupgradeneeded = function(){
    var db = r.result; upgradeTx = r.transaction;
    store = db.createObjectStore('s', {keyPath:'k'});
    idx = store.createIndex('i', 'v');
    t('dup store', function(){return db.createObjectStore('s')});
    t('delete missing store', function(){return db.deleteObjectStore('zz')});
    t('db.transaction in upgrade', function(){return db.transaction('s')});
    var tmp = db.createObjectStore('tmp'); db.deleteObjectStore('tmp');
    t('deleted store use', function(){return tmp.put(1,1)});
    t('deleted store name', function(){return tmp.name});
    store.name = 'renamed';
    log('renamed '+store.name+' '+Array.from(db.objectStoreNames)+' '+Array.from(upgradeTx.objectStoreNames));
    store.name = 's';
    idx.name = 'j';
    log('index renamed '+idx.name+' '+Array.from(store.indexNames));
    idx.name = 'i';
    t('rename to existing', function(){db.createObjectStore('other'); store.name = 'other'});
    t('rename index to existing', function(){store.createIndex('i2','v'); idx.name='i2'});
    var pend = store.get(1);
    t('pending result', function(){return pend.result});
    t('pending error', function(){return pend.error});
    t('key path mismatch', function(){return store.put({k:1}, 2)});
    t('missing key', function(){return store.put({x:1})});
    t('get no key', function(){return store.get()});
    t('get bad key', function(){return store.get({})});
    t('get null', function(){return store.get(null)});
    t('delete no key', function(){return store.delete()});
    t('count bad', function(){return store.count({})});
    t('cursor bad range', function(){return store.openCursor(NaN)});
  };
  var db = await req(r);
  t('rename outside upgrade', function(){var st=db.transaction('s').objectStore('s'); st.name='q'});
  t('createIndex outside upgrade', function(){return db.transaction('s','readwrite').objectStore('s').createIndex('a','a')});
  t('upgrade tx store after finish', function(){return upgradeTx.objectStore('s')});
  t('store after finish', function(){return store.get(1)});
  t('index after finish', function(){return idx.get(1)});
  t('index on finished tx', function(){return store.index('i')});
  var tx = db.transaction('s', 'readwrite');
  var q = tx.objectStore('s').put({k:1, v:1});
  var e1 = null;
  q.onsuccess = function(){ t('result after', function(){return q.result}); t('error after', function(){return q.error}); };
  await done(tx);
  t('tx.error after complete', function(){return tx.error});
  t('abort after complete', function(){tx.abort()});
  t('request.transaction after', function(){return String(q.transaction)});
  var e = new Event('success');
  var tx2 = db.transaction('s');
  var q2 = tx2.objectStore('s').get(1);
  q2.addEventListener('success', function(ev){ log('synthetic? '+ev.isTrusted); });
  q2.dispatchEvent(e);
  await done(tx2);
  db.close();
  await a('delete', function(){return req(indexedDB.deleteDatabase('errs')).then(String)});
  end();
})();
</script>

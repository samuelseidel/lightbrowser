<!DOCTYPE html><title>geo</title><script>
// Argument checks and objects of the Geolocation API.
window.surface = () => {
  const r = {};
  const g = navigator.geolocation;
  const t = (f) => { try { const v = f(); return ['ok', v === undefined ? 'undefined' : v]; } catch (e) { return ['throw', e.constructor.name, e.message]; } };
  r.noArgs = t(() => g.getCurrentPosition());
  r.notFn = t(() => g.getCurrentPosition(5));
  r.errNotFn = t(() => g.getCurrentPosition(() => {}, 5));
  r.errNull = t(() => g.getCurrentPosition(() => {}, null));
  r.optsBad = t(() => g.getCurrentPosition(() => {}, null, 5));
  r.watchNoArgs = t(() => g.watchPosition());
  r.watchNotFn = t(() => g.watchPosition({}));
  r.watchIds = [g.watchPosition(() => {}), g.watchPosition(() => {})];
  r.clear = [t(() => g.clearWatch()), t(() => g.clearWatch('x')), t(() => g.clearWatch(r.watchIds[0])), t(() => g.clearWatch(999))];
  r.watchAfter = g.watchPosition(() => {});
  g.clearWatch(r.watchIds[1]); g.clearWatch(r.watchAfter);
  r.illegal = t(() => Geolocation.prototype.getCurrentPosition.call({}, () => {}));
  r.ctors = ['Geolocation', 'GeolocationPosition', 'GeolocationCoordinates', 'GeolocationPositionError'].map(n => t(() => new self[n]()));
  r.consts = [GeolocationPositionError.PERMISSION_DENIED, GeolocationPositionError.POSITION_UNAVAILABLE, GeolocationPositionError.TIMEOUT];
  r.same = navigator.geolocation === navigator.geolocation;
  r.tag = Object.prototype.toString.call(navigator.geolocation);
  return r;
};
// One getCurrentPosition: the position (timestamp made relative to the
// call) or the error.
window.one = (opts) => new Promise(res => {
  const t0 = Date.now();
  navigator.geolocation.getCurrentPosition(p => {
    const j = p.toJSON();
    res({ ok: true, same: p.coords === p.coords, coords: j.coords, cjson: p.coords.toJSON(), keys: Object.keys(j), recent: Math.abs(p.timestamp - t0) < 60000, str: String(p), cstr: String(p.coords) });
  }, e => res({ ok: false, code: e.code, message: e.message, str: String(e), json: JSON.stringify(e) }), opts);
});
window.watched = [];
window.startWatch = () => navigator.geolocation.watchPosition(p => watched.push(['pos', p.coords.latitude]), e => watched.push(['err', e.code, e.message]));
</script>

[workspace]
resolver = "3"
members = ["crates/*", "bin/lightbrowser"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Size-tuned build for measuring disk footprint.
[profile.release-small]
inherits = "release"
opt-level = "s"

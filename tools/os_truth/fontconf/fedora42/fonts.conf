<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fedora 42 Workstation font preferences, for capture.js (FONTCONFIG_FILE).
     Fedora prefers Noto for the generics and ships Adwaita Sans/Mono as the
     GNOME 48 UI fonts (GTK "Adwaita Sans 11", the gtk-font option of capture.js).
     Fonts missing here fall back to installed ones. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <!-- The stock fontconfig rules both distros ship; the container-only
       56-prefer-inter.conf is left out on purpose. -->
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-hinting-slight.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/10-scale-bitmap-fonts.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/11-lcdfilter-default.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/30-metric-aliases.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/40-nonlatin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/45-generic.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/45-latin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/48-spacing.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/49-sansserif.conf</include>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>Adwaita Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family><family>Adwaita Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Adwaita Sans</family><family>Noto Sans</family></prefer></alias>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/60-generic.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/60-latin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/65-nonlatin.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/70-no-bitmaps-except-emoji.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/90-synthetic.conf</include>
</fontconfig>
